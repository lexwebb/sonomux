[package]
name = "sonomux-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "sonomux_daemon"
path = "src/lib.rs"

[[bin]]
name = "sonomuxd"
path = "src/main.rs"

[[bin]]
name = "sonomuxctl"
path = "src/bin/sonomuxctl.rs"

[dependencies]
sonomux-core = { path = "../sonomux-core" }
sonomux-backend = { path = "../sonomux-backend" }
sonomux-device-goxlr = { path = "../sonomux-device-goxlr" }
sonomux-device-headset = { path = "../sonomux-device-headset" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
zbus.workspace = true
serde_json.workspace = true
