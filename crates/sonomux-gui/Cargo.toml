[package]
name = "sonomux-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sonomux"
path = "src/main.rs"

[dependencies]
sonomux-core = { path = "../sonomux-core" }
sonomux-backend = { path = "../sonomux-backend" }
sonomux-device-goxlr = { path = "../sonomux-device-goxlr" }
sonomux-device-headset = { path = "../sonomux-device-headset" }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
slint.workspace = true
zbus.workspace = true

[build-dependencies]
slint-build = "1.18"

# Skia renders text far better than the default on macOS (see main.rs).
[target.'cfg(target_os = "macos")'.dependencies]
slint = { workspace = true, features = ["renderer-skia"] }
